<!doctype html>
<html><head><meta charset="utf-8"><title>Synthetic Shop</title>
<style>body{font-family:sans-serif;max-width:720px;margin:2rem auto}.product{display:flex;gap:.5rem;align-items:center;margin:.3rem 0}</style>
</head><body>
<h1>Synthetic Shop</h1><p><em>Demo shop. All products, users and orders are synthetic.</em></p>
<section><h2>Login</h2>
<input id="username" placeholder="username"> <input id="password" type="password" placeholder="password">
<button id="login-btn">Login</button> <span id="login-msg"></span></section>
<section><h2>Products</h2><div id="products"></div></section>
<section><h2>Cart</h2><ul id="cart-items"></ul><p id="cart-total">Total: 0.00</p>
<input id="discount" placeholder="discount code"> <button id="checkout-btn">Checkout</button>
<p id="order-msg"></p></section>
<script>
let token = null;
const $ = (id) => document.getElementById(id);
async function api(method, path, body) {
  const headers = {'Content-Type': 'application/json'};
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  return {ok: r.ok, data: await r.json()};
}
function renderCart(c) {
  $('cart-items').innerHTML = c.items.map(i => `<li>${i.name} x ${i.quantity} = ${i.line_total.toFixed(2)}</li>`).join('');
  $('cart-total').textContent = 'Total: ' + c.total.toFixed(2);
}
async function loadProducts() {
  const {data} = await api('GET', '/api/products');
  $('products').innerHTML = data.map(p => `<div class="product"><span>${p.name} - ${p.price.toFixed(2)} (stock ${p.stock})</span>
    <input id="qty-${p.id}" type="number" value="1" style="width:4rem"><button id="add-${p.id}">Add</button></div>`).join('');
  data.forEach(p => { $('add-' + p.id).onclick = () => addItem(p.id); });
}
async function addItem(id) {
  const r = await api('POST', '/api/cart/items', {product_id: id, quantity: parseInt($('qty-' + id).value, 10)});
  if (r.ok) renderCart(r.data); else $('order-msg').textContent = 'Error: ' + r.data.detail;
}
$('login-btn').onclick = async () => {
  const r = await api('POST', '/api/login', {username: $('username').value, password: $('password').value});
  if (r.ok) { token = r.data.token; renderCart((await api('GET', '/api/cart')).data); $('login-msg').textContent = 'Logged in as ' + $('username').value; }
  else { $('login-msg').textContent = 'Login failed'; }
};
$('checkout-btn').onclick = async () => {
  const r = await api('POST', '/api/orders', {discount_code: $('discount').value || null});
  if (r.ok) { $('order-msg').textContent = `Order #${r.data.id} confirmed, total ${r.data.total.toFixed(2)}`; renderCart({items: [], total: 0}); }
  else { $('order-msg').textContent = 'Error: ' + r.data.detail; }
};
loadProducts();
</script></body></html>
